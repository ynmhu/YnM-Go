# ────────── Plugins (true/false) ──────────

Plugins:
  # BEGIN:PLUGINS_owner
  # YnM owner
  enable_control: true         # ⚠️ DANGER! To Enables !die, !restart, !reload commands
  enable_update: false           # ⚠️ DANGER! To Enables !update, !upgrade commands
  enable_debug: false            # ⚠️ DANGER! To Debug mode active
  enable_webauth: false          # ⚠️ DANGER! To WebAuth mode active
  enable_ctcp: false             # ⚠️ DANGER! To CTCP Reply mode active
  enable_autotopic: false        # ⚠️ DANGER! To AutoTopic ConsoleChan mode active
  enable_service_m: false        # ⚠️ DANGER! To Enable Service Manager mode active
  enable_fail2ban: false         # ⚠️ DANGER! To Enable Fail2Ban
  # END:PLUGINS_owner


  # BEGIN:PLUGINS_IRC
  # YnM IRC Plugins
  enable_cycle: true            # Cycle plugin when no @
  enable_ping: false             # Enables ping command to check bot responsiveness
  enable_xp: false               # Tracks and awards experience points to users
  enable_help: false
  enable_mp3scanner: false
  enable_botmanager: false
  # END:PLUGINS_IRC


  # BEGIN:PLUGINS_WEB
  # YnM Web plugins
  enable_webstatus: false        # Shows status of web services
  enable_yt: false               # Provides YouTube video search and info
  enable_forum: false            # Forum related features
  enable_webhook: false          # Allows receiving webhooks
  enable_ExTrigger: false        # Allows sending messages to webhooks
  enable_git: false              # Git repository interactions
  enable_link: false             # Link shortening or handling
  # END:PLUGINS_WEB


  # BEGIN:PLUGINS_MEDIA
  # Media plugins
  enable_movie: false            # Movie information and lookup
  enable_movie_request: false    # Allows users to request movies
  enable_movie_completion: false # Completes movie requests automatically
  enable_movie_deletion: false   # Allows deletion of movie entries
  enable_media_upload: false     # Upload media to server
  enable_media_ajanlat: false    # Suggest media recommendations
  enable_jellyfin_info: false    # Fetch info from Jellyfin server
  enable_media_activity: false   # Tracks media-related activity
  enable_latest_music: false     # Tracks www.legszebbnotak.hu
  enable_telegram: false         # Telegram
  # END:PLUGINS_MEDIA


  # BEGIN:PLUGINS_SCHEDULED
  # Scheduled plugins
  enable_joke: false             # Sends scheduled jokes
  enable_szekelyhon: false       # Provides news from Szekelyhon
  enable_nameday: false          # Announces namedays
  enable_huntorrent: false       # Checks for torrent availability
  # END:PLUGINS_SCHEDULED


  # BEGIN:PLUGINS_INTERACT
  # YnM Interact
  enable_chatgpt: false          # ChatGPT interaction plugin
  enable_horoscope: false        # Provides daily horoscopes
  enable_learn: false            # Learning and quiz features
  enable_imdb: false             # Fetch movie info from IMDb
  enable_vicc: false             # Tells jokes (vicc = joke)
  enable_weather: false          # Provides weather information
  enable_seen: false             # Tracks last seen activity of users
  enable_sms: false              # SMS sending feature
  enable_status: false           # System or user status reporting
  enable_ora: false              # Time related plugin (ora = clock/time)
  enable_alexa: false            # Amazon Alexa
  # END:PLUGINS_INTERACT


  # BEGIN:PLUGINS_SYSTEM
  # YnM System
  enable_monitor: false          # System monitoring
  enable_bruteforce: false       # Security testing/hacking tools
  enable_resource_monitor: false
  # END:PLUGINS_SYSTEM


  # BEGIN:PLUGINS_NETWORK
  # YnM Network Plugins
  enable_ssh: false              # SSH connection plugin
  enable_nmap: false             # Network scanning using Nmap
  enable_dns: false              # DNS lookup tools
  enable_ip: false               # IP address utilities
  enable_pinghost: false         # Ping specific hosts
  enable_uptime: false           # Show Uptime !uptime
  enable_discord: false          # Discord
  enable_joinmessage: false
  enable_joinmessage_discord: false
  # END:PLUGINS_NETWORK


  # BEGIN:PLUGINS_EXPERIMENTAL
  # YnM False & Working (experimental/disabled)
  enable_autovoice: false        # Automatic voice assign
  enable_mail: false             # Mail sending/receiving
  enable_xes0: false             # Experimental plugin
  # END:PLUGINS_EXPERIMENTAL
  
